services:
  - type: web
    name: nexora-defi
    runtime: python
    plan: free
    branch: development
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PAPER_TRADING_ENABLED
        value: "true"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: DEXSCREENER_ENABLED
        value: "true"
      - key: GECKOTERMINAL_ENABLED
        value: "true"
      - key: BIRDEYE_ENABLED
        value: "true"
      - key: TARGET_UNIVERSE_SIZE
        value: "30"
      - key: CANDIDATE_UNIVERSE_SIZE
        value: "100"
      - key: UNIVERSE_GECKO_PAGES
        value: "12"
      - key: UNIVERSE_DEX_SEARCH_QUERIES
        value: "solana,SOL,USDC,JUP,RAY,ORCA,BONK,WIF,JTO,PYTH,Jupiter,Raydium,Orca,Marinade,Kamino,Tensor,Drift,KMNO,DRIFT,JITOSOL,MSOL,INF,CLOUD,TNSR,GRASS,PENGU,PNUT,POPCAT,MEW,HNT,MOBILE,IO,ZEUS,W,RENDER"
      - key: MIN_TOKEN_AGE_DAYS
        value: "30"
      - key: MIN_LIQUIDITY_USD
        value: "100000"
      - key: MIN_VOLUME_24H_USD
        value: "250000"
      - key: MIN_MARKET_CAP_USD
        value: "0"
      - key: STRATEGY_EMA_FAST
        value: "12"
      - key: STRATEGY_EMA_SLOW
        value: "30"
      - key: SIGNAL_MIN_QUALITY_SCORE
        value: "70"
      - key: BIRDEYE_API_KEY
        sync: false
      - key: MORALIS_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: COINGECKO_ENABLED
        value: "false"
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: CRYPTOPANIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANALYST_PROVIDER
        value: template
      - key: ANALYST_MODEL
        value: nexora-template-v1
      - key: OPENAI_API_KEY
        sync: false
