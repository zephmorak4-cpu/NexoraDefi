services:
  - type: web
    name: nexora-defi
    runtime: python
    plan: free
    branch: development
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PAPER_TRADING_ENABLED
        value: "true"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: DEXSCREENER_ENABLED
        value: "true"
      - key: GECKOTERMINAL_ENABLED
        value: "true"
      - key: BIRDEYE_ENABLED
        value: "true"
      - key: TARGET_UNIVERSE_SIZE
        value: "30"
      - key: CANDIDATE_UNIVERSE_SIZE
        value: "100"
      - key: MIN_TOKEN_AGE_DAYS
        value: "30"
      - key: MIN_LIQUIDITY_USD
        value: "100000"
      - key: MIN_VOLUME_24H_USD
        value: "250000"
      - key: MIN_MARKET_CAP_USD
        value: "0"
      - key: BIRDEYE_API_KEY
        sync: false
      - key: MORALIS_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: COINGECKO_ENABLED
        value: "false"
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: CRYPTOPANIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANALYST_PROVIDER
        value: template
      - key: ANALYST_MODEL
        value: nexora-template-v1
      - key: OPENAI_API_KEY
        sync: false
