[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexora-defi"
version = "0.1.0"
description = "Telegram-first crypto quant intelligence data infrastructure"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/database/migrations/*"]
